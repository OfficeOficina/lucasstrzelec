<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucas Strzelec</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
  /* the landing page: just the initials, in the middle of the page. Change the colour here. */
  :root{--ink:#000}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:#fff;display:grid;place-items:center;touch-action:none}
  .ljs{font-family:"EB Garamond",Garamond,"Times New Roman",serif;font-weight:700;color:var(--ink);text-decoration:none;
       font-size:clamp(56px,min(24vw,20vh),260px);line-height:1;letter-spacing:0;cursor:pointer;
       user-select:none;-webkit-user-select:none;-webkit-user-drag:none;
       transition:font-size .7s cubic-bezier(.3,.1,.2,1),padding-bottom .7s cubic-bezier(.3,.1,.2,1)}
  /* open: the whole name, all one size, made to fit the height of the screen and kept in the middle */
  .ljs.open{font-size:clamp(40px,min(24vw,12vh),260px);padding-bottom:calc(7*.92em)}
  .ljs>span{margin:0;transition:margin .7s cubic-bezier(.3,.1,.2,1)}
  .ljs.open>span{margin:0 .22em}                 /* the columns step apart so the letters never touch */
  .ljs>span{display:inline-block;position:relative;will-change:transform}
  /* the rest of the name hangs under each initial, the same size */
  .tail{position:absolute;left:50%;top:100%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
  .tail i{display:block;font-style:normal;line-height:.92;opacity:0;transform:translateY(-.25em);transition:opacity .45s ease,transform .45s ease}
  .open .tail i{opacity:1;transform:none}
  .ljs:focus-visible{outline:2px solid var(--ink);outline-offset:8px}
</style>
</head>
<body>
  <!-- move the mouse over the initials and they come with you, each letter trailing behind the one before it.
       The pointer always sits in the middle of the name. Click once and the full name appears; click again to go to the projects. (On a phone: drag them with your finger, tap to go in.) -->
  <a class="ljs" id="ljs" href="projects.html" aria-label="Lucas Strzelec: projects" draggable="false"><span>L</span><span>J</span><span>S</span></a>

<script>
(function(){
  var a=document.getElementById("ljs"),ls=[].slice.call(a.children),
      FOLLOW=.28;                                   // how quickly each letter catches up (smaller = longer trail)
  var p=ls.map(function(){return{x:0,y:0}}),       // where each letter has been moved to, from its place in the middle of the page
      ptr=null,carried=false,last=0,raf=0,touch=null;

  /* the rest of the name, hanging under each initial */
  var REST=["UCAS","OSEPH","TRZELEC"],opened=false;
  ls.forEach(function(l,i){
    var t=document.createElement("span");t.className="tail";t.setAttribute("aria-hidden","true");
    REST[i].split("").forEach(function(ch,j){var c=document.createElement("i");c.textContent=ch;
      c.style.transitionDelay=(j*.07+i*.05)+"s";t.appendChild(c)});
    l.appendChild(t);
  });
  var openAt=0;
  function open(){opened=true;openAt=performance.now();a.classList.add("open");a.setAttribute("aria-label","Lucas Joseph Strzelec: projects");go()}
  function enter(){location.href=a.getAttribute("href")}

  /* the pointer always sits in the middle of the name: the letters are pulled so that their centre is under it */
  function target(){
    if(!carried||!ptr)return{x:0,y:0};
    var r=a.getBoundingClientRect();              // the name in its resting place (it grows when the full name opens)
    return{x:ptr.x-(r.left+r.width/2),y:ptr.y-(r.top+r.height/2)};
  }
  function go(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
  function frame(now){
    var dt=Math.min(3,(now-last)/16.67),k=1-Math.pow(1-FOLLOW,dt),busy=opened&&now-openAt<900,t=target();last=now;
    ls.forEach(function(l,i){
      var to=i===0?t:p[i-1],q=p[i];               // L follows the pointer, J follows L, S follows J
      q.x+=(to.x-q.x)*k;q.y+=(to.y-q.y)*k;
      if(Math.abs(to.x-q.x)>.1||Math.abs(to.y-q.y)>.1)busy=true;
      l.style.transform="translate("+q.x+"px,"+q.y+"px)";
    });
    raf=busy?requestAnimationFrame(frame):0;
  }

  /* mouse: pass over the letters to pick them up; from then on they stay with you.
     Click once: the full name appears. Click again: in to the projects. */
  a.addEventListener("pointerover",function(e){if(e.pointerType==="mouse"&&!carried){carried=true;ptr={x:e.clientX,y:e.clientY};go()}});
  addEventListener("pointermove",function(e){if(e.pointerType==="mouse"||touch){ptr={x:e.clientX,y:e.clientY};if(touch&&Math.hypot(e.clientX-touch.x,e.clientY-touch.y)>6)touch.moved=true;go()}});
  addEventListener("click",function(e){
    if(e.pointerType&&e.pointerType!=="mouse"){e.preventDefault();return}  // taps are handled below
    var onName=e.target.closest&&e.target.closest("#ljs");
    if(!carried&&!onName)return;                    // before you have picked it up, only the name itself responds
    e.preventDefault();if(opened)enter();else open();
  });

  /* touch: press and drag the name with your finger (it stays centred under it); a tap opens the name, a second tap goes in */
  a.addEventListener("pointerdown",function(e){
    if(e.pointerType==="mouse")return;
    e.preventDefault();touch={x:e.clientX,y:e.clientY,moved:false};carried=true;ptr={x:e.clientX,y:e.clientY};go();
  });
  addEventListener("pointerup",function(){if(!touch)return;var t=touch;touch=null;carried=false;go();if(!t.moved){if(opened)enter();else open()}});
  addEventListener("pageshow",function(){carried=false;touch=null});
})();
</script>
</body>
</html>
