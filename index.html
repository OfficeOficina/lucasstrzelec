<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucas Strzelec</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}          /* page colour */

  /* the spiral: hidden at first, then it opens out of the circle and fills the page while it turns */
  .grow{position:fixed;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;
        transform:scale(0);transition:transform 1.5s cubic-bezier(.2,.75,.2,1);pointer-events:none}
  .on .grow{transform:scale(1)}
  .wheel{width:100%;height:100%;animation:spin 14s linear infinite}                     /* 14s = one full turn. Smaller = faster */
  .wheel svg{display:block;width:100%;height:100%}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* the circle: what you see first, and the middle of the wheel afterwards (same size) */
  .hub{position:fixed;left:50%;top:50%;width:30vmin;height:30vmin;margin:-15vmin 0 0 -15vmin;border-radius:50%;
       background:#000;box-shadow:0 0 0 1.4vmin #fff;display:grid;place-items:center;cursor:pointer;
       transition:transform .25s ease;-webkit-tap-highlight-color:transparent;outline:none}
  .hub:hover{transform:scale(1.04)}
  .hub:focus-visible{box-shadow:0 0 0 1.4vmin #fff,0 0 0 calc(1.4vmin + 2px) #000}
  .on .hub{cursor:default}
  .on .hub:hover{transform:none}
  .msg{width:24vmin;margin:0;text-align:center;color:#fff;font-size:clamp(12px,3.4vmin,36px);line-height:1.22;letter-spacing:.01em;
       opacity:0;transition:opacity .8s ease}
  .msg.in{opacity:1}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){                                              /* less motion: the wheel just fades in and stays still */
    .wheel{animation:none}
    .grow{transform:none;opacity:0;transition:opacity .8s ease}
    .on .grow{opacity:1}
  }
</style>
</head>
<body>
  <h1 class="sr">Lucas Strzelec Architecture</h1>
  <div class="grow" aria-hidden="true"><div class="wheel"><svg id="spiral" viewBox="-100 -100 200 200"></svg></div></div>
  <div class="hub" id="hub" role="button" tabindex="0" aria-label="Enter"><p class="msg" id="msg" aria-live="polite"></p></div>

<script>
/* the sentences, one every 5 seconds once you have clicked the circle: edit, add or remove lines here */
var SENTENCES = [
  "Architecture is worth it",
  "Your budget is bigger than you think",
  "You don't need to save your money",
  "You need an architect to do that",
  "Hire me",
  "Lucas Strzelec"
];
var EVERY = 5;       // seconds between sentences
var LOOP  = false;   // false = stay on the last sentence, true = start again from the first

/* draw the spiral: ARMS black arms, each one winding TURNS times around the centre */
(function () {
  var ARMS = 7, TURNS = 3, STEPS = 220, WIDTH = 0.5,          // WIDTH: how much of each gap is black (0.5 = half)
      svg = document.getElementById("spiral"), d = "";
  for (var j = 0; j < ARMS; j++) {
    var off = j * 2 * Math.PI / ARMS, w = WIDTH * 2 * Math.PI / ARMS, a = [], b = [], i, th, r;
    for (i = 0; i <= STEPS; i++) {
      th = TURNS * 2 * Math.PI * i / STEPS; r = 100 * i / STEPS;
      a.push((r * Math.cos(th + off)).toFixed(2) + " " + (r * Math.sin(th + off)).toFixed(2));
      b.push((r * Math.cos(th + off + w)).toFixed(2) + " " + (r * Math.sin(th + off + w)).toFixed(2));
    }
    d += "M" + a.join("L") + "L" + b.reverse().join("L") + "Z";
  }
  var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", d); p.setAttribute("fill", "#000"); svg.appendChild(p);
})();

/* click the circle: the page spirals, then the sentences start */
(function () {
  var hub = document.getElementById("hub"), msg = document.getElementById("msg"), started = false, i = 0, IN = 0.8;
  function show() {
    msg.textContent = SENTENCES[i];
    requestAnimationFrame(function () { requestAnimationFrame(function () { msg.classList.add("in"); }); });   // fade in
    if (i === SENTENCES.length - 1 && !LOOP) return;                  // the last one stays
    setTimeout(function () { msg.classList.remove("in"); }, (EVERY - IN) * 1000);    // fade out just before the next
    setTimeout(function () { i = (i + 1) % SENTENCES.length; show(); }, EVERY * 1000);
  }
  function start() {
    if (started) return; started = true;
    document.body.classList.add("on");
    hub.removeAttribute("role"); hub.removeAttribute("tabindex"); hub.removeAttribute("aria-label");
    setTimeout(show, 1000);                                           // the first sentence arrives as the spiral settles
  }
  hub.addEventListener("click", start);
  hub.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); } });
})();
</script>
</body>
</html>
